<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦊 Pago Crypto — NEXUS INTEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #06060a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 40px; max-width: 520px; width: 100%; }
        .card h1 { font-size: 1.4rem; color: #fff; margin-bottom: 24px; text-align: center; }
        .order-box { background: rgba(0,212,255,0.04); border: 1px solid rgba(0,212,255,0.12); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .order-box .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .order-box .row:last-child { border: none; }
        .order-box .label { color: #888; }
        .order-box .value { color: #fff; font-weight: 600; }
        .wallet-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; margin: 20px 0; text-align: center; }
        .wallet-addr { font-family: monospace; color: #00d4ff; word-break: break-all; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 8px; margin: 12px 0; cursor: pointer; }
        .wallet-addr:hover { background: rgba(0,212,255,0.1); }
        .copy-btn { background: rgba(0,212,255,0.12); color: #00d4ff; border: 1px solid rgba(0,212,255,0.2); padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; font-family: 'Inter', sans-serif; }
        .tokens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
        .token { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 14px; text-align: center; }
        .token .sym { font-size: 1.2rem; font-weight: 700; color: #fff; }
        .token .name { font-size: 0.75rem; color: #888; }
        .confirm-btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 16px; font-family: 'Inter', sans-serif; }
        .note { color: #888; font-size: 0.85rem; margin-top: 16px; text-align: center; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #888; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>🦊 Pago con Crypto</h1>
    <div class="order-box">
        <div class="row"><span class="label">Plan</span><span class="value">{{ order.plan_name }}</span></div>
        <div class="row"><span class="label">Total</span><span class="value" style="color:#e94560;font-size:1.2rem;">${{ order.price }} USD</span></div>
    </div>
    <div class="tokens">
        <div class="token"><div class="sym">ETH</div><div class="name">Ethereum</div></div>
        <div class="token"><div class="sym">USDC</div><div class="name">USD Coin</div></div>
        <div class="token"><div class="sym">USDT</div><div class="name">Tether</div></div>
    </div>
    <div class="wallet-box">
        <div style="color:#888;margin-bottom:8px;">Envía a esta wallet:</div>
        <div class="wallet-addr" onclick="navigator.clipboard.writeText(this.textContent)">{{ config.wallet_address }}</div>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('{{ config.wallet_address }}')">📋 Copiar Dirección</button>
        <div style="color:#ffd700;margin-top:12px;">Envía <strong>${{ order.price }}</strong> en USDC/USDT o equivalente en ETH</div>
    </div>
    <form method="POST" action="/confirm/{{ order_id }}">
        <button type="submit" class="confirm-btn">✅ Ya Envié el Crypto</button>
    </form>
    <p class="note">Tu token se generará en menos de 24 horas tras confirmar el pago</p>
    <div class="link"><a href="/">← Volver</a></div>
</div>
</body>
</html>

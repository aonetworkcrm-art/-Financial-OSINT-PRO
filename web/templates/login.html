<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login — NEXUS INTEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #06060a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 48px; max-width: 440px; width: 100%; }
        .card h1 { font-size: 1.6rem; color: #fff; margin-bottom: 8px; text-align: center; }
        .card .sub { color: #888; text-align: center; margin-bottom: 32px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #fff; font-size: 1rem; font-family: 'Inter', sans-serif; }
        .form-group input:focus { outline: none; border-color: #e94560; }
        .form-group input::placeholder { color: #444; }
        .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #e94560, #c23152); color: #fff; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn:hover { box-shadow: 0 4px 20px rgba(233,69,96,0.4); }
        .link { text-align: center; margin-top: 20px; color: #888; font-size: 0.9rem; }
        .link a { color: #e94560; text-decoration: none; }
        .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        .flash.danger { background: rgba(233,69,96,0.12); color: #e94560; border: 1px solid rgba(233,69,96,0.2); }
        .flash.success { background: rgba(0,212,255,0.08); color: #00d4ff; border: 1px solid rgba(0,212,255,0.15); }
    </style>
</head>
<body>
<div class="card">
    <h1>🔐 Iniciar Sesión</h1>
    <p class="sub">Accede a tu panel de NEXUS INTEL</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label>Usuario o Email</label>
            <input type="text" name="username" placeholder="tu-usuario o tu@email.com" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Iniciar Sesión →</button>
    </form>

    <div class="link">¿No tienes cuenta? <a href="/register">Regístrate</a></div>
    <div class="link" style="margin-top:8px;"><a href="/">← Volver al inicio</a></div>
</div>
</body>
</html>
